<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Static copies of the default-language title and description, for link previews (LinkedIn,
       WhatsApp, Slack) and crawlers that don't run JavaScript. The page replaces them at runtime;
       `npm run validate` warns when they no longer match src/content/ and src/config/site.json. -->
  <title>David Augusto Hurtado Pipicano</title>
  <meta name="description" content="Senior Software Engineer with 14 years of experience: .NET (C#), Python, AWS, CI/CD and Generative AI.">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="David Augusto Hurtado Pipicano">
  <meta property="og:description" content="Senior Software Engineer with 14 years of experience: .NET (C#), Python, AWS, CI/CD and Generative AI.">
  <meta property="og:url" content="https://davidhurtadop.github.io/cv-template/">
  <meta name="twitter:card" content="summary">
  <!-- Must match "defaultTheme" in config/site.json: auto, light or dark. -->
  <meta name="theme-default" content="auto">
  <!-- PNG first for browsers without SVG favicons (Safari); browsers that support SVG prefer it. -->
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <script>
    // Apply the theme before first paint to avoid a flash: saved choice > default > system.
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      var meta = document.querySelector('meta[name="theme-default"]');
      var fallback = meta ? meta.content : 'auto';
      var theme = stored === 'light' || stored === 'dark' ? stored
        : fallback === 'light' || fallback === 'dark' ? fallback
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/carousel.css">
</head>
<body>
  <div id="app"></div>
  <noscript>
    <p class="p-4">This page needs JavaScript. You can read the CV as plain text in
      <a href="content/cv.en.md">content/cv.en.md</a>.</p>
  </noscript>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
